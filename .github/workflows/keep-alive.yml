name: Keep Servers Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Check
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://lawfirm-backend-vt0m.onrender.com/api/v1/health
